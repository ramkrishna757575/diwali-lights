; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:leonardo]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_deps = 
	kitesurfer1404/WS2812FX@^1.4.4
	mike-matera/ArduinoSTL@^1.3.3

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
lib_deps =
	kitesurfer1404/WS2812FX@^1.4.4
	makuna/NeoPixelBus@^2.8.0
; LED_PIN 2 is NodeMCU D4, which the LED output hardware requires. LED_BRIGHTNESS is 0-255: 600 LEDs can draw 36A at
; 255. the code dims any frame that would draw more than about 4A, for a 5V 5A supply.
build_flags =
	-DLED_COUNT=600
	-DLED_PIN=2
	-DLED_COLOR_ORDER=NEO_GRB
	-DLED_BRIGHTNESS=90
	'-DOTA_PASSWORD="${secrets.ota_password}"'

; Updates over Wi-Fi: pio run -e nodemcuv2_ota -t upload
[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = diwali-lights.local
upload_flags =
	--auth=${secrets.ota_password}
